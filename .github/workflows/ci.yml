name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # TreatWarningsAsErrors (Directory.Build.props) により、警告が1件でもあればビルドが失敗する。
      - name: Build
        run: dotnet build -c Release

      # テスト出力 (「前提不成立: ...」を含む) をログに残すため、詳細表示のコンソールロガーを使う。
      - name: Test
        run: dotnet test -c Release --no-build --logger "console;verbosity=detailed"

      # 配布形態 (単一ファイルの自己完結型 exe。win-x64.pubxml) を publish し、E2E (X 系) を同じテストのままその exe に対して実行する。
      # 出力先はリポジトリの外 (runner.temp)。
      - name: Publish (single-file)
        run: dotnet publish src/Unextract.Cli -p:PublishProfile=win-x64 -o "${{ runner.temp }}\publish"

      - name: E2E test (published exe)
        env:
          UNEXTRACT_E2E_EXE: ${{ runner.temp }}\publish\unextract.exe
        run: dotnet test tests/Unextract.E2E.Tests -c Release --no-build --logger "console;verbosity=detailed"
