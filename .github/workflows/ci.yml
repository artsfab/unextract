name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # RAR のテストが使う採用版の UnRAR64.dll を rarlab から取得し、外側の exe と DLL の SHA-256 を照合してリポジトリ外 (runner.temp) に置く
      # (docs/TESTING.md#rar)。DLL はリポジトリにも配布物にも入れない (docs/spec/rar.md#pinning)。取得・照合に失敗したらこのステップで CI を失敗にする
      # (RAR のテストを成功扱いにしない)。以降の検証は UNEXTRACT_TEST_UNRAR_DLL で DLL を読む。
      # GITHUB_ENV への追記は BOM を付けない (Windows PowerShell 5.1 の Out-File -Encoding utf8 は BOM を付ける)。
      - name: UnRAR.dll for RAR tests (pinned, outside the repository)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = & ./scripts/get-unrar-dll.ps1 -OutputDirectory "${{ runner.temp }}\unrar"
          if ([string]::IsNullOrEmpty($dll) -or -not (Test-Path -LiteralPath $dll -PathType Leaf)) { throw 'UnRAR64.dll was not prepared.' }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "UNEXTRACT_TEST_UNRAR_DLL=$dll`n")

      # 標準の検証 (docs/TESTING.md#verify)。Release ビルド (警告ゼロ)、solution のテスト、publish 版 E2E、GUI の publish とスモークを
      # ローカルと同じスクリプトで実行する。-Ci は UI E2E だけを除く (GITHUB_ACTIONS=true のときしか受け付けない)。
      - name: Verify (standard verification without UI E2E)
        id: verify
        shell: powershell
        run: ./scripts/verify.ps1 -Ci

      # 成功・失敗を問わず、TRX・診断・summary.txt を成果物として残す。
      - name: Upload verification results
        if: always() && steps.verify.outputs.results != ''
        uses: actions/upload-artifact@v4
        with:
          name: verify-results
          path: ${{ steps.verify.outputs.results }}
          if-no-files-found: warn
